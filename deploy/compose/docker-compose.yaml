include:
  - path: ./redis.yaml

services:
  postgres:
    image: postgres:latest
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - postgres-data:/data
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: ${PG_USER}

volumes:
  postgres-data:
